name: Android build

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate Android project
        # Generate the android/ shell with the runner's exact Flutter SDK so
        # Gradle/AGP/Kotlin versions always match what this Flutter requires,
        # then restore Sauda's branding customizations on top.
        run: |
          set -e
          REGEN=/tmp/sauda_regen
          rm -rf "$REGEN" /tmp/sauda_keep
          mkdir -p /tmp/sauda_keep/res
          flutter create -t app --org com.sauda --project-name app --platforms=android "$REGEN"
          cp android/app/src/main/AndroidManifest.xml /tmp/sauda_keep/AndroidManifest.xml
          cp android/app/src/main/res/drawable/launch_background.xml /tmp/sauda_keep/launch_background.xml
          cp -r android/app/src/main/res/mipmap-mdpi /tmp/sauda_keep/res/
          cp -r android/app/src/main/res/mipmap-hdpi /tmp/sauda_keep/res/
          cp -r android/app/src/main/res/mipmap-xhdpi /tmp/sauda_keep/res/
          cp -r android/app/src/main/res/mipmap-xxhdpi /tmp/sauda_keep/res/
          cp -r android/app/src/main/res/mipmap-xxxhdpi /tmp/sauda_keep/res/
          rm -rf android
          cp -r "$REGEN/android" android
          cp /tmp/sauda_keep/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/sauda_keep/launch_background.xml android/app/src/main/res/drawable/launch_background.xml
          rm -rf android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          cp -r /tmp/sauda_keep/res/mipmap-mdpi android/app/src/main/res/
          cp -r /tmp/sauda_keep/res/mipmap-hdpi android/app/src/main/res/
          cp -r /tmp/sauda_keep/res/mipmap-xhdpi android/app/src/main/res/
          cp -r /tmp/sauda_keep/res/mipmap-xxhdpi android/app/src/main/res/
          cp -r /tmp/sauda_keep/res/mipmap-xxxhdpi android/app/src/main/res/
          echo "--- generated settings.gradle ---"
          cat android/settings.gradle
          echo "--- generated gradle-wrapper.properties ---"
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sauda-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
